<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Проверка сети</title>
<style>
body{margin:0;background:#fff;color:#363744;font:16px/1.5 "CoFo Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:40px max(16px,env(safe-area-inset-left,0px))}
.w{max-width:560px;margin:0 auto;display:grid;gap:16px}
h1{margin:0;font-size:28px;font-weight:500;color:#202028}
p{margin:0;color:#8B8DA5}
.row{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid #E2E4EA;border-radius:12px}
.s{font-weight:500}.ok{color:#17A448}.bad{color:#FF2F13}.wait{color:#8B8DA5}
button{font:inherit;font-weight:500;border:0;border-radius:12px;padding:12px 20px;background:rgba(0,123,252,.08);color:#007BFC;cursor:pointer;justify-self:start}
</style></head><body><div class="w">
<h1>Проверка сети</h1>
<p>Открой эту страницу с рабочего компьютера и пришли скриншот Ивану.</p>
<div id="list"></div>
<button id="copy" type="button">Скопировать результат</button>
<p id="st"></p>
</div><script>
const T=[
 ["Telegram","https://api.telegram.org/"],
 ["GitHub API","https://api.github.com/zen"],
 ["Яндекс Облако","https://functions.yandexcloud.net/"],
 ["Яндекс Формы","https://forms.yandex.ru/"],
 ["Google Apps Script","https://script.google.com/"],
 ["Formspree","https://formspree.io/"],
 ["Supabase","https://supabase.com/"],
 ["Cloudflare Workers","https://workers.cloudflare.com/"],
 ["Vercel","https://vercel.com/"],
 ["Netlify","https://api.netlify.com/"],
];
const list=document.getElementById("list"),res={};
T.forEach(([n,u])=>{
  const r=document.createElement("div");r.className="row";
  const a=document.createElement("span");a.textContent=n;const b=document.createElement("span");b.className="s wait";b.textContent="проверяю…";
  r.append(a,b);list.append(r);
  const ac=new AbortController();const to=setTimeout(()=>ac.abort(),8000);const t0=performance.now();
  fetch(u,{mode:"no-cors",cache:"no-store",signal:ac.signal}).then(()=>{b.className="s ok";b.textContent="открывается · "+Math.round(performance.now()-t0)+" мс";res[n]="ok"})
   .catch(()=>{b.className="s bad";b.textContent="заблокирован";res[n]="blocked"}).finally(()=>clearTimeout(to));
});
document.getElementById("copy").onclick=async()=>{const t=T.map(([n])=>n+": "+(res[n]||"?")).join("\n");try{await navigator.clipboard.writeText(t);document.getElementById("st").textContent="Скопировано"}catch(e){document.getElementById("st").textContent=t}};
</script></body></html>
